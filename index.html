<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Chatroom</title>
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <script src="main.js" type="module"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app">Loading...</div>
        
        <template id="template">
            <div>
                <router-link to="/">
                    <h1>ToneChat</h1>
                </router-link>
                <router-link to="/login" class="authentication-button">
                    <button>Login / Logout</button>
                </router-link>
                <router-view></router-view>
            </div>
        </template>

        <template id="home-template">
            <div>
                <div v-if="!isInChat && $graffitiSession.value">
                    <h2>Chats</h2>
                    <p v-if="chats.length === 0 && !areChatsLoading">
                        <em>No chats yet. Create one!</em>
                    </p>
                    <form v-if="$graffitiSession.value" @submit.prevent="newChat()">
                        <input
                            type="text"
                            v-model="newChatTitle"
                            placeholder="Chat title"
                            required
                        />
                        <input type="submit" :value="isCreatingChat? 'Creating Chat...': 'Create Chat'" :disabled="!newChatTitle.trim() || isCreatingChat"></input>
                        <p v-show="isCreatingChat">Creating Chat...</p>
                    </form>
                    <p v-else class="login-required-message">
                        Please <router-link to="/login">log in</router-link> to create new chats
                    </p>
                    <ul v-if="chats.length > 0" class="chats-container" ref="chatsContainer">
                        <li v-for="chat in sortedChats" :key="chat.url">
                            <router-link :to="`/chat/${chat.value.channel}`" @click="selectChat(chat)" style="font-size: 1.5rem;">
                                {{ chat.value.title }}
                            </router-link>
                            <span v-if="isMessageCountLoaded(chat.value.channel)" class="message-count">
                                ({{ getMessageCount(chat.value.channel) }} message{{ getMessageCount(chat.value.channel) !== 1 ? 's' : '' }})
                            </span>
                            <span v-else-if="isMessageCountLoading(chat.value.channel)" class="message-count-loading">(loading...)</span>
                            <span v-else class="message-count-loading">(loading...)</span>
                            <button 
                                v-if="chat.actor===$graffitiSession.value?.actor && $graffitiSession.value"
                                @click="startChatEdit(chat)"
                                :disabled="isDeletingChat.has(chat.url)"
                            >
                                Edit
                            </button>
                            <template v-if="editingChat?.url === chat.url">
                                <form @submit.prevent="saveChatEdit(chat)" style="display: inline;">
                                    <input 
                                        type="text" 
                                        v-model="editChatTitle" 
                                        :placeholder="chat.value.title"
                                        required
                                        @click.stop
                                    />
                                    <button type="submit" :disabled="isSavingChatEdit || !editChatTitle.trim()">
                                        {{ isSavingChatEdit ? 'Saving...' : 'Save' }}
                                    </button>
                                    <p v-show="isSavingChatEdit">Saving chat edit...</p>
                                    <button type="button" @click="cancelChatEdit" :disabled="isSavingChatEdit">
                                        Cancel
                                    </button>
                                </form>
                            </template>
                            <button
                                v-if="chat.actor === $graffitiSession.value?.actor && $graffitiSession.value"
                                @click="deleteChat(chat)" 
                                :disabled="isDeletingChat.has(chat.url)  || (editingChat?.url === chat.url && isSavingChatEdit)"
                                >
                                {{ isDeletingChat.has(chat.url) ? "Deleting..." : "Delete" }}
                            </button>
                            <p v-show="isDeletingChat.has(chat.url)">Deleting chat...</p>
                        </li>
                    </ul>
                </div>
                <div v-if="isInChat && $graffitiSession.value" style="text-align: center;">
                    <router-link to="/">
                        Return to Chats List
                    </router-link>
                </div>
                <div v-if="channel && $route.params.chatId" class="messaging-interface">
                    <h2 style="text-align: center;">Messages</h2>
                    <h3 style="text-align: center;">Current chat: {{ currentChatTitle }}</h3>
                    <div style="text-align: center;">
                        <router-link to="/customize" class="customize-button">
                            <button>Customize Tone Info</button>
                        </router-link>
                        <div class="tone-search">
                            <label>Filter by tone: </label>
                            <select v-model="selectedToneFilter" :title="selectedToneFilter && selectedToneFilter.length > 30 ? selectedToneFilter : ''">
                                <option value="">All tones</option>
                                <option v-for="tone in toneOptionsWithTooltips" :key="tone.fullName" :value="tone.fullName" :title="tone.fullName.length > 30 ? tone.fullName : ''">
                                    {{ tone.truncatedName }}
                                </option>
                            </select>
                            <span v-if="filteredMessagesCount !== sortedMessageObjects.length && sortedMessageObjects.length > 0" class="filter-stats">
                                Showing {{ filteredMessagesCount }} of {{ sortedMessageObjects.length }} messages
                                <button @click="selectedToneFilter = ''">Clear</button>
                            </span>
                        </div>
                    </div>
                    <p v-if="areMessageObjectsLoading && channel">
                        <em>Loading messages...</em>
                    </p>
                    <div v-else if="!channel"></div>
                    <ul v-if="!areMessageObjectsLoading" class="messages-container" ref="messagesContainer">
                        <li v-for="object of filteredMessageObjects" :key="object.url" :class="{ 'own-message': object.actor === $graffitiSession.value?.actor }" :style="{ '--tone-color': getMessageToneColor(object) }">
                            <div class="message-row">
                                <tone-indicator :tone="object.value.tone"></tone-indicator>
                                <strong>
                                    <graffiti-actor-to-handle :actor="object.actor">
                                    </graffiti-actor-to-handle>:
                                </strong>
                                <span class="message-text" v-html="formatMessageWithLinks(object.value.content)"></span>
                                <p v-show="isDeleting.has(object.url)">Deleting message...</p> 
                                <button
                                    v-if="object.actor===$graffitiSession.value?.actor && editingMessage?.url !== object.url"
                                    @click="startEdit(object)" :disabled="isDeleting.has(object.url)"
                                >
                                    Edit
                                </button>
                                <button
                                    v-if="object.actor===$graffitiSession.value?.actor"
                                    @click="deleteMessage(object)"
                                    :disabled="isDeleting.has(object.url) || (editingMessage?.url === object.url && isSavingEdit)"
                                >
                                    {{ isDeleting.has(object.url) ? "Deleting..." : "Delete" }}
                                </button>
                            </div>
                            <form v-if="editingMessage?.url === object.url">
                                <textarea 
                                    type="text" 
                                    v-model="editContent" 
                                    placeholder="Edit message"
                                    @keydown="handleEditKeydown"
                                ></textarea>
                                <select v-model="editTone" :title="editTone && editTone.length > 30 ? editTone : ''">
                                    <option v-for="tone in toneOptionsWithTooltips" :key="tone.fullName" :value="tone.fullName" :title="tone.fullName.length > 30 ? tone.fullName : ''">
                                        {{ tone.truncatedName }}
                                    </option>
                                </select>
                                <button @click="saveEdit(object)" :disabled="isSavingEdit || isDeleting.has(object.url)">
                                    {{ isSavingEdit ? 'Saving...' : 'Save' }}
                                </button>
                                <button @click="cancelEdit" :disabled="isSavingEdit || isDeleting.has(object.url)">
                                    Cancel
                                </button>
                            </form>
                        </li>
                    </ul>
                    <form v-if="$graffitiSession.value" @submit.prevent="sendMessage()">
                        <textarea
                            type="text"
                            v-model="myMessage"
                            placeholder="Message"
                            @keydown="handleMessageKeydown"
                        ></textarea>
                        <select v-model="selectedTone" :title="selectedTone && selectedTone.length > 30 ? selectedTone : ''">
                            <option value="">Select tone</option>
                            <option v-for="tone in toneOptionsWithTooltips" :key="tone.fullName" :value="tone.fullName" :title="tone.fullName.length > 30 ? tone.fullName : ''">
                                {{ tone.truncatedName }}
                            </option>
                        </select>
                        <input
                            type="submit"
                            :value="isSending ? 'Sending...' : 'Send'"
                            :disabled="!myMessage || isSending"
                        />
                        <p v-show="isSending">Sending...</p>
                    </form>
                    <div v-else class="login-required-message">
                        <p>Please <router-link to="/login">log in</router-link> to send messages</p>
                    </div>
                </div>
            </div>
        </template>

        <template id="login-template">
            <div class="login-container">
                <h2>Authentication</h2>
                <div v-if="$graffitiSession.value" class="logged-in-state">
                    <p>You are currently logged in as: 
                        <strong>
                            <graffiti-actor-to-handle :actor="$graffitiSession.value.actor">
                            </graffiti-actor-to-handle>
                        </strong>
                    </p>
                    <button @click="handleLogout" class="logout-button">
                        Log Out
                    </button>
                </div>
                <div v-else class="logged-out-state">
                    <p>You are not logged in. Please log in to continue.</p>
                    <button @click="handleLogin" class="login-button">
                        Log In
                    </button>
                </div>
            </div>
        </template>

        <template id="customize-template">
            <div>
                <router-link to="/">
                    Return to Chats List
                </router-link>
            </div>
            <div>
                <button @click="toggleColorsSection" class="toggle-colors-btn" style="margin-top: 1rem;">
                    {{ showColorsSection ? 'Hide' : 'Show' }} Color Editing Section
                </button>
                <div v-show="showColorsSection">
                    <h2>Customize Tone Colors</h2>
                    <h3>These colors only appear for you</h3>
                    <div class="colors">
                        <div v-for="(color, toneName) in toneColors" :key="toneName">
                            <div class="tone-color">
                                <span :title="getFullToneName(toneName) && getFullToneName(toneName).length > 30 ? getFullToneName(toneName) : ''" style="text-transform: capitalize;">
                                    {{ truncateToneName(getFullToneName(toneName) || (toneName === 'noTone' ? 'No tone' : toneName)) }}
                                </span>
                                <div
                                    :style="{ backgroundColor: color, width: '1.5rem', height: '1.5rem', 
                                    border: '1px solid #ffffff', borderRadius: '0.2rem', 
                                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    color: toneTextColors[toneName] || '#000000', fontSize: '0.8rem', fontWeight: 'bold' }"
                                    @click="startToneEdit(toneName)"
                                >T</div>
                            </div>
                            <form v-if="editingTone === toneName" @submit.prevent="saveToneColor">
                                <label>Background:</label>
                                <input 
                                    type="color" 
                                    v-model="editingToneColor"
                                    style="width: 3rem; height: 3rem; border: none; padding: 0;"
                                />
                                <label>Text:</label>
                                <input 
                                    type="color" 
                                    v-model="editingToneTextColor"
                                    style="width: 3rem; height: 3rem; border: none; padding: 0;"
                                />
                                <div 
                                    :style="{ 
                                        backgroundColor: editingToneColor, 
                                        color: editingToneTextColor,
                                        width: '100px',
                                        height: '60px',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        borderRadius: '0.2rem',
                                        padding: '0 10px'
                                    }"
                                >
                                    Sample Text
                                </div>
                                <button type="submit">Save</button>
                                <button type="button" @click="cancelToneEdit">Cancel</button>
                            </form>
                        </div>
                    </div>
                    <button @click="resetToDefaults">Reset to Default Colors</button>
                </div>
                
                <button @click="toggleTonesSection" class="toggle-tones-btn" style="margin-top: 1rem;">
                    {{ showTonesSection ? 'Hide' : 'Show' }} Tone Editing Section
                </button>
                <div v-show="showTonesSection">
                    <h2>Your Custom Tones</h2>
                    <h3>These tones appear for everyone, but the colors only appear for you</h3>
                    <div v-if="getAllTones().some(t => t.isCustom)" class="custom-tones-list">
                        <div v-for="tone in getAllTones().filter(t => t.isCustom)" :key="tone.key" class="tone-color-item">
                            <div class="tone-color">
                                <span :title="tone.name.length > 30 ? tone.name : ''" style="text-transform: capitalize;">{{ tone.name.length > 30? truncateToneName(tone.name) : tone.name }}</span>
                                <div
                                    :style="{ 
                                        backgroundColor: toneColors[tone.key], 
                                        width: '1.5rem', 
                                        height: '1.5rem', 
                                        border: '1px solid #ffffff', 
                                        borderRadius: '0.2rem',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        color: toneTextColors[tone.key] || '#000000',
                                        fontSize: '0.8rem',
                                        fontWeight: 'bold'
                                    }"
                                    @click="startToneEdit(tone.key)"
                                >T</div>
                            </div>
                            <button 
                                @click="deleteCustomTone(tone.key)"
                                class="delete-custom-tone-btn"
                                :disabled="deletingCustomTone === tone.key"
                            >
                                {{ deletingCustomTone === tone.key ? 'Deleting...' : 'Delete Tone' }}
                            </button>
                        </div>
                    </div>
                    <div v-if="showCustomTonesForm" class="custom-tone-form">
                        <h3>Add Custom Tone</h3>
                        <form @submit.prevent="addNewCustomTone">
                            <input 
                                type="text" 
                                v-model="newCustomToneName" 
                                placeholder="Tone name"
                                required
                            />
                            <label>Background:</label>
                            <input 
                                type="color" 
                                v-model="newCustomToneBgColor"
                                required
                                style="width: 3rem; height: 3rem; border: none; padding: 0;"
                            />
                            <label>Text:</label>
                            <input 
                                type="color" 
                                v-model="newCustomToneTextColor"
                                required
                                style="width: 3rem; height: 3rem; border: none; padding: 0;"
                            />
                            <div 
                                :style="{ 
                                    backgroundColor: newCustomToneBgColor, 
                                    color: newCustomToneTextColor,
                                    width: '100px',
                                    height: '60px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    borderRadius: '0.2rem',
                                    padding: '0 10px'
                                }"
                            >
                                {{ 'Sample Text' }}
                            </div>
                            <button type="submit" :disabled="!newCustomToneName.trim()">
                                Add Custom Tone
                            </button>
                            <button type="button" @click="showCustomTonesForm = false">
                                Cancel
                            </button>
                        </form>
                    </div>
                    <div v-else>
                        <button @click="showCustomTonesForm = true" class="add-custom-tone-btn">
                            Add Custom Tone
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <template id="tone-indicator-template">
            <span 
                :class="['tone-indicator', toneClass]" 
                :title="toneText"
                :style="{ backgroundColor: getToneColor, color: getToneTextColor }"
            >
                {{ truncatedToneText }}
            </span>
        </template>
    </body>
</html>
